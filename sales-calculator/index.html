<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="销售计算器">
    <meta name="theme-color" content="#1a73e8">
    <title>销售价格计算器（含税）</title>
    <style>
        /* ============ CSS 变量 ============ */
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --primary-light: #e8f0fe;
            --success: #34a853;
            --success-light: #e6f4ea;
            --danger: #ea4335;
            --danger-light: #fce8e6;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --text-light: #9aa0a6;
            --border: #e0e0e0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC',
                'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============ 全局样式 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ 主容器 ============ */
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ============ 标题栏 ============ */
        .app-header {
            text-align: center;
            padding: 20px 16px 12px;
            position: relative;
        }

        .app-header .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 8px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .app-header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* ============ 卡片样式 ============ */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 18px;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card:active {
            transform: scale(0.99);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
        }

        /* ============ 输入区域 ============ */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
        }

        .input-label .unit {
            color: var(--text-light);
            font-weight: 400;
            font-size: 0.8rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            pointer-events: none;
            z-index: 1;
        }

        .input-suffix {
            position: absolute;
            right: 14px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            pointer-events: none;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 36px;
            font-size: 1.3rem;
            font-weight: 600;
            font-family: var(--font-family);
            color: var(--text);
            background: #f8f9fa;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: var(--transition);
            -webkit-appearance: none;
            appearance: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.12);
        }

        .input-wrapper input::placeholder {
            color: var(--text-light);
            font-weight: 400;
            font-size: 1rem;
        }

        /* 移除数字输入的上下箭头 */
        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-wrapper input[type='number'] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* ============ 快捷按钮 ============ */
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .quick-btn {
            flex: 1 1 auto;
            min-width: 56px;
            padding: 10px 8px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-family);
            color: var(--primary);
            background: var(--primary-light);
            border: 1.5px solid transparent;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .quick-btn:hover {
            background: #d2e3fc;
            border-color: var(--primary);
        }

        .quick-btn:active {
            transform: scale(0.93);
            background: var(--primary);
            color: #ffffff;
        }

        /* ============ 结果显示 ============ */
        .result-card {
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 50%, #0d47a1 100%);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 24px 20px 20px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        .result-card::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .result-label {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .result-price {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            word-break: break-all;
            transition: var(--transition);
            cursor: pointer;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .result-price:active {
            transform: scale(0.97);
        }

        .result-price .currency {
            font-size: 1.8rem;
            font-weight: 600;
            vertical-align: top;
            margin-right: 4px;
        }

        .result-details {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-xs);
            padding: 10px 14px;
            min-width: 80px;
            flex: 1 1 auto;
            transition: var(--transition);
        }

        .detail-item .detail-label {
            font-size: 0.72rem;
            font-weight: 500;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .detail-item .detail-value {
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 2px;
            word-break: break-all;
        }

        /* ============ 操作按钮 ============ */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }

        .action-btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: var(--font-family);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .action-btn:active {
            transform: scale(0.94);
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ============ 历史记录 ============ */
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .history-header .card-title {
            margin-bottom: 0;
        }

        .clear-history-btn {
            font-size: 0.8rem;
            font-weight: 500;
            font-family: var(--font-family);
            color: var(--danger);
            background: var(--danger-light);
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .clear-history-btn:active {
            transform: scale(0.92);
            background: var(--danger);
            color: #ffffff;
        }

        .history-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            transition: var(--transition);
            border-radius: var(--radius-xs);
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: #f8f9fa;
        }
        .history-item:active {
            background: var(--primary-light);
            transform: scale(0.98);
        }

        .history-item .h-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item .h-main {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .history-item .h-sub {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .history-item .h-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .history-empty {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .history-empty .empty-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* ============ 提示弹窗 ============ */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #323232;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: var(--font-family);
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease;
            opacity: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 360px) {
            .result-price {
                font-size: 2.3rem;
            }
            .result-price .currency {
                font-size: 1.4rem;
            }
            .app-header h1 {
                font-size: 1.35rem;
            }
            .card {
                padding: 16px 14px;
            }
            .detail-item {
                min-width: 70px;
                padding: 8px 10px;
            }
        }

        @media (min-width: 481px) {
            body {
                padding: 24px;
                align-items: center;
            }
            .app-container {
                max-width: 440px;
            }
        }

        /* ============ 暗色模式支持 ============ */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --card-bg: #242438;
                --text: #e8e8e8;
                --text-secondary: #b0b0c0;
                --text-light: #7a7a8a;
                --border: #3a3a4e;
                --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.4);
                --primary-light: #1e3a5f;
                --success-light: #1a3a2a;
                --danger-light: #4a2020;
            }

            .input-wrapper input {
                background: #1a1a2e;
                color: #e8e8e8;
                border-color: #3a3a4e;
            }

            .input-wrapper input:focus {
                background: #1e1e32;
                border-color: var(--primary);
            }

            .history-item:hover {
                background: #1e1e32;
            }

            .history-item {
                border-bottom-color: #2a2a3e;
            }

            .quick-btn {
                background: #1e3a5f;
                color: #4a9eff;
            }
            .quick-btn:hover {
                background: #254a75;
            }
            .quick-btn:active {
                background: var(--primary);
                color: #ffffff;
            }
        }
    </style>
</head>
<body>
    <!-- ============ 提示弹窗 ============ -->
    <div class="toast" id="toast"></div>

    <!-- ============ 主容器 ============ -->
    <div class="app-container">
        <!-- 标题 -->
        <header class="app-header">
            <span class="icon">🧮</span>
            <h1>销售价格计算器</h1>
            <p class="subtitle">含税计算 · 进项税 · 销项税 · 附加税 · 毛利</p>
        </header>

        <!-- 输入区域 -->
        <div class="card">
            <div class="card-title"><span class="dot"></span> 输入参数</div>

            <!-- 采购价 -->
            <div class="input-group">
                <label class="input-label" for="costInput">采购价（含税） <span class="unit">(¥)</span></label>
                <div class="input-wrapper">
                    <span class="input-prefix">¥</span>
                    <input type="number" id="costInput" inputmode="decimal" placeholder="请输入含税采购价"
                    autocomplete="off" step="any" min="0">
                </div>
            </div>

            <!-- 加层比率 -->
            <div class="input-group" style="margin-bottom: 0;">
                <label class="input-label" for="rateInput">加层比率 <span class="unit">(加价率)</span></label>
                <div class="input-wrapper">
                    <input type="number" id="rateInput" inputmode="decimal" placeholder="请输入加层比率"
                    autocomplete="off" step="any" min="0" style="padding-right: 42px;">
                    <span class="input-suffix">%</span>
                </div>
                <!-- 快捷比率按钮 -->
                <div class="quick-buttons">
                    <button class="quick-btn" data-rate="1">1%</button>
                    <button class="quick-btn" data-rate="2">2%</button>
                    <button class="quick-btn" data-rate="3">3%</button>
                    <button class="quick-btn" data-rate="5">5%</button>
                    <button class="quick-btn" data-rate="8">8%</button>
                    <button class="quick-btn" data-rate="10">10%</button>
                    <button class="quick-btn" data-rate="15">15%</button>
                    <button class="quick-btn" data-rate="20">20%</button>
                    <button class="quick-btn" data-rate="25">25%</button>
                    <button class="quick-btn" data-rate="30">30%</button>
                </div>
            </div>
        </div>

        <!-- 计算结果 -->
        <div class="result-card" id="resultCard">
            <div class="result-label">📊 销售价格（含税）</div>
            <div class="result-price" id="resultPrice" title="点击复制结果">
                <span class="currency">¥</span><span id="resultValue">0.00</span>
            </div>

            <div class="result-details" id="resultDetails">
                <!-- 动态展示进项税、销项税、附加税、印花税、毛利润、毛利率 -->
                <div class="detail-item">
                    <div class="detail-label">进项税</div>
                    <div class="detail-value" id="inputTax">¥0.00</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">销项税</div>
                    <div class="detail-value" id="outputTax">¥0.00</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">附加税</div>
                    <div class="detail-value" id="surcharge">¥0.00</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">印花税</div>
                    <div class="detail-value" id="stampDuty">¥0.00</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">毛利润</div>
                    <div class="detail-value" id="grossProfit">¥0.00</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">毛利率</div>
                    <div class="detail-value" id="grossMargin">0.0000%</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-copy" id="copyBtn">📋 复制</button>
                <button class="action-btn btn-reset" id="resetBtn">🔄 重置</button>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="card">
            <div class="history-header">
                <div class="card-title"><span class="dot"></span> 计算历史</div>
                <button class="clear-history-btn" id="clearHistoryBtn">🗑 清空</button>
            </div>
            <ul class="history-list" id="historyList">
                <!-- 历史记录动态生成 -->
            </ul>
            <div class="history-empty" id="historyEmpty">
                <span class="empty-icon">📋</span>
                暂无计算记录，快来试试吧！
            </div>
        </div>

        <!-- 页脚 -->
        <footer style="text-align:center; padding:12px 0; color:var(--text-light); font-size:0.75rem;">
            💡 点击销售价可直接复制 &nbsp;|&nbsp; 数据保存在本地
        </footer>
    </div>

    <script>
        (function() {
            // ============ DOM 元素 ============
            const costInput = document.getElementById('costInput');
            const rateInput = document.getElementById('rateInput');
            const resultValue = document.getElementById('resultValue');
            const inputTaxEl = document.getElementById('inputTax');
            const outputTaxEl = document.getElementById('outputTax');
            const surchargeEl = document.getElementById('surcharge');
            const stampDutyEl = document.getElementById('stampDuty');
            const grossProfitEl = document.getElementById('grossProfit');
            const grossMarginEl = document.getElementById('grossMargin');
            const resultPrice = document.getElementById('resultPrice');
            const copyBtn = document.getElementById('copyBtn');
            const resetBtn = document.getElementById('resetBtn');
            const historyList = document.getElementById('historyList');
            const historyEmpty = document.getElementById('historyEmpty');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const toast = document.getElementById('toast');
            const quickBtns = document.querySelectorAll('.quick-btn');

            // ============ 状态 ============
            let lastResult = null;
            let toastTimeout = null;

            // ============ 常量 ============
            const HISTORY_KEY = 'sales_calculator_history_v2';
            const MAX_HISTORY = 50;
            const STORAGE_COST_KEY = 'sales_calculator_cost_v2';
            const STORAGE_RATE_KEY = 'sales_calculator_rate_v2';

            // ============ 工具函数 ============
            function formatNumber(num, digits = 2) {
                if (isNaN(num) || !isFinite(num)) return '0.00';
                return num.toFixed(digits).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            function formatPrice(num) {
                return '¥' + formatNumber(num);
            }

            function getTimestamp() {
                const now = new Date();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                return `${month}-${day} ${hours}:${minutes}`;
            }

            function showToast(message, duration = 1800) {
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }
                toast.textContent = message;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
                }
                return Promise.resolve(fallbackCopy(text));
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);
                let success = false;
                try {
                    success = document.execCommand('copy');
                } catch (e) {
                    success = false;
                }
                document.body.removeChild(textarea);
                return success;
            }

            // ============ 计算逻辑 ============
            function calculate() {
                const cost = parseFloat(costInput.value);
                const rate = parseFloat(rateInput.value);

                if (isNaN(cost) || cost < 0 || isNaN(rate) || rate < 0) {
                    resultValue.textContent = '0.00';
                    inputTaxEl.textContent = '¥0.00';
                    outputTaxEl.textContent = '¥0.00';
                    surchargeEl.textContent = '¥0.00';
                    stampDutyEl.textContent = '¥0.00';
                    grossProfitEl.textContent = '¥0.00';
                    grossMarginEl.textContent = '0.0000%';
                    lastResult = null;
                    return;
                }

                // 销售价 = 采购价 * (1 + 加层比率/100)
                const salePrice = cost * (1 + rate / 100);
                // 进项税 = 采购价 - 采购价 / 1.13
                const inputTax = cost - cost / 1.13;
                // 销项税 = 销售价 - 销售价 / 1.13
                const outputTax = salePrice - salePrice / 1.13;
                // 附加税 = (销项税 - 进项税) * 12%
                const surcharge = (outputTax - inputTax) * 0.12;
                // 印花税 = 销售价 * 0.03%
                const stampDuty = salePrice * 0.0003;
                // 毛利润 = (销售价/1.13 - 采购价/1.13) - 附加税 - 印花税
                const grossProfit = (salePrice / 1.13 - cost / 1.13) - surcharge - stampDuty;
                // 毛利率 = 毛利润 / 销售价 * 100%
                const grossMargin = (grossProfit / salePrice) * 100;

                // 保留精度
                const roundedSalePrice = Math.round(salePrice * 100) / 100;
                const roundedInputTax = Math.round(inputTax * 100) / 100;
                const roundedOutputTax = Math.round(outputTax * 100) / 100;
                const roundedSurcharge = Math.round(surcharge * 100) / 100;
                const roundedStampDuty = Math.round(stampDuty * 100) / 100;
                const roundedGrossProfit = Math.round(grossProfit * 100) / 100;
                const roundedGrossMargin = Math.round(grossMargin * 10000) / 10000; // 保留四位小数

                resultValue.textContent = formatNumber(roundedSalePrice);
                inputTaxEl.textContent = formatPrice(roundedInputTax);
                outputTaxEl.textContent = formatPrice(roundedOutputTax);
                surchargeEl.textContent = formatPrice(roundedSurcharge);
                stampDutyEl.textContent = formatPrice(roundedStampDuty);
                grossProfitEl.textContent = formatPrice(roundedGrossProfit);
                grossMarginEl.textContent = formatNumber(roundedGrossMargin, 4) + '%';

                lastResult = {
                    cost: cost,
                    rate: rate,
                    salePrice: roundedSalePrice,
                    inputTax: roundedInputTax,
                    outputTax: roundedOutputTax,
                    surcharge: roundedSurcharge,
                    stampDuty: roundedStampDuty,
                    grossProfit: roundedGrossProfit,
                    grossMargin: roundedGrossMargin,
                    time: getTimestamp()
                };

                return lastResult;
            }

            // ============ 历史记录 ============
            function getHistory() {
                try {
                    const data = localStorage.getItem(HISTORY_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveHistory(history) {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                } catch (e) {
                    console.warn('无法保存历史记录:', e);
                }
            }

            function addToHistory(record) {
                if (!record) return;
                let history = getHistory();
                history.unshift(record);
                if (history.length > MAX_HISTORY) {
                    history = history.slice(0, MAX_HISTORY);
                }
                saveHistory(history);
                renderHistory();
            }

            function renderHistory() {
                const history = getHistory();
                if (history.length === 0) {
                    historyList.innerHTML = '';
                    historyEmpty.style.display = 'block';
                    return;
                }
                historyEmpty.style.display = 'none';
                historyList.innerHTML = history.map((item, index) => {
                    return `
                        <li class="history-item" data-index="${index}" data-sale-price="${item.salePrice}">
                            <div class="h-info">
                                <div class="h-main">采购 ¥${formatNumber(item.cost)} → 销售 ¥${formatNumber(item.salePrice)}</div>
                                <div class="h-sub">${item.time} · 加层 ${item.rate}% · 毛利 ¥${formatNumber(item.grossProfit)}</div>
                            </div>
                            <div class="h-price">¥${formatNumber(item.salePrice)}</div>
                        </li>
                    `;
                }).join('');

                document.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const salePrice = this.dataset.salePrice;
                        if (salePrice) {
                            copyToClipboard(salePrice).then(() => {
                                showToast('✅ 已复制: ¥' + formatNumber(parseFloat(salePrice)));
                            });
                        }
                    });
                });
            }

            function clearHistory() {
                saveHistory([]);
                renderHistory();
                showToast('🗑 历史记录已清空');
            }

            // ============ 保存/恢复输入 ============
            function saveInputs() {
                try {
                    localStorage.setItem(STORAGE_COST_KEY, costInput.value);
                    localStorage.setItem(STORAGE_RATE_KEY, rateInput.value);
                } catch (e) {
                    // 忽略
                }
            }

            function restoreInputs() {
                try {
                    const savedCost = localStorage.getItem(STORAGE_COST_KEY);
                    const savedRate = localStorage.getItem(STORAGE_RATE_KEY);
                    if (savedCost) costInput.value = savedCost;
                    if (savedRate) rateInput.value = savedRate;
                } catch (e) {
                    // 忽略
                }
            }

            // ============ 重置 ============
            function resetAll() {
                costInput.value = '';
                rateInput.value = '';
                resultValue.textContent = '0.00';
                inputTaxEl.textContent = '¥0.00';
                outputTaxEl.textContent = '¥0.00';
                surchargeEl.textContent = '¥0.00';
                stampDutyEl.textContent = '¥0.00';
                grossProfitEl.textContent = '¥0.00';
                grossMarginEl.textContent = '0.0000%';
                lastResult = null;
                saveInputs();
                costInput.focus();
                showToast('🔄 已重置');
            }

            // ============ 事件监听 ============
            costInput.addEventListener('input', function() {
                calculate();
                saveInputs();
            });

            rateInput.addEventListener('input', function() {
                calculate();
                saveInputs();
            });

            quickBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const rate = this.dataset.rate;
                    rateInput.value = rate;
                    calculate();
                    saveInputs();
                    this.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });

            copyBtn.addEventListener('click', function() {
                if (!lastResult || lastResult.salePrice <= 0) {
                    showToast('⚠️ 请先输入有效的采购价和比率');
                    return;
                }
                const textToCopy = lastResult.salePrice.toFixed(2);
                copyToClipboard(textToCopy).then((success) => {
                    if (success) {
                        showToast('✅ 已复制销售价: ¥' + formatNumber(lastResult.salePrice));
                    } else {
                        showToast('❌ 复制失败，请手动复制');
                    }
                });
            });

            resultPrice.addEventListener('click', function() {
                if (!lastResult || lastResult.salePrice <= 0) {
                    showToast('⚠️ 暂无结果可复制');
                    return;
                }
                const textToCopy = lastResult.salePrice.toFixed(2);
                copyToClipboard(textToCopy).then((success) => {
                    if (success) {
                        showToast('✅ 已复制: ¥' + formatNumber(lastResult.salePrice));
                        addToHistory(lastResult);
                    } else {
                        showToast('❌ 复制失败');
                    }
                });
            });

            resetBtn.addEventListener('click', resetAll);

            clearHistoryBtn.addEventListener('click', function() {
                if (getHistory().length === 0) {
                    showToast('📋 历史已经是空的');
                    return;
                }
                if (confirm('确定要清空所有历史记录吗？')) {
                    clearHistory();
                }
            });

            costInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (lastResult && lastResult.salePrice > 0) {
                        addToHistory(lastResult);
                        showToast('📝 已保存到历史');
                    }
                    rateInput.focus();
                }
            });
            rateInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (lastResult && lastResult.salePrice > 0) {
                        addToHistory(lastResult);
                        showToast('📝 已保存到历史');
                    }
                    rateInput.blur();
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    saveInputs();
                }
            });

            window.addEventListener('beforeunload', function() {
                saveInputs();
            });

            // ============ 初始化 ============
            function init() {
                restoreInputs();
                renderHistory();
                calculate();
                setTimeout(() => {
                    if (!costInput.value) {
                        costInput.focus();
                    }
                }, 300);
            }

            init();
        })();
    </script>
</body>
</html>
